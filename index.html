<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --card:#11161d; --choice:#1a2029; --choice-h:#202733; --hover:#1c222b;
  --teal:#4fb8b0; --line:#2a313c; --line2:#353d4a; --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
  --blue:#58a6ff; --blue-btn:#5aa2f7; --blue-bg:#16263d; --blue-line:#2f5d99; --on-primary:#06152b;
  --green:#3fb950; --green-tile:#4caf50; --green-bg:#12261a; --on-green:#0b2410; --green-line:#235c33; --tag-ok:#0d2b16;
  --red:#f85149; --red-tile:#e5534b; --red-bg:#2d1517; --tag-bad:#3a1416;
  --mark:#f2cc60; --flag:#d29922; --flag-line:#6b4f10;
  --why-bg:#141a22; --wt:#c9d1d9; --key-bg:#221b0c; --key-fg:#e3c27a;
  --badge-fg:#d2a8ff; --badge-line:#5a3d8a; --badge-bg:#211830; --toast:#30363d; --pick:#3b4352;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#ffffff; --card:#ffffff; --choice:#f6f8fa; --choice-h:#eef1f4; --hover:#eef1f4;
  --teal:#2b9a91; --line:#d8dee4; --line2:#c4ccd5; --text:#1f2328; --muted:#59636e; --dim:#8c959f;
  --blue:#0969da; --blue-btn:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff; --on-primary:#ffffff;
  --green:#1a7f37; --green-tile:#2da44e; --green-bg:#dafbe1; --on-green:#ffffff; --green-line:#4ac26b; --tag-ok:#c9f2d3;
  --red:#cf222e; --red-tile:#cf222e; --red-bg:#ffebe9; --tag-bad:#ffd8d3;
  --mark:#fff2a8; --flag:#9a6700; --flag-line:#d4a72c;
  --why-bg:#f6f8fa; --wt:#424a53; --key-bg:#fff8c5; --key-fg:#7d4e00;
  --badge-fg:#8250df; --badge-line:#c297ff; --badge-bg:#fbefff; --toast:#24292f; --pick:#c4ccd5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px 70px 1fr;height:100vh}
.app.norail{grid-template-columns:270px 1fr}
.app.norail .rail{display:none}

/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 14px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.stools{padding:0 12px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{width:100%;background:var(--choice);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:8px 30px 8px 32px;font:inherit;font-size:14px}
.search input:focus{outline:none;border-color:var(--blue)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:15px;padding:2px 6px;display:none}
.search.has .clr{display:block}
.srow{display:flex;gap:6px}
.sbtn{flex:1;background:transparent;border:1px solid var(--line2);border-radius:7px;padding:7px 6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.sbtn:hover{background:var(--hover)}
.sbtn.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.sbtn.th{flex:0 0 58px}
.chap-h{padding:16px 9px 7px;color:var(--muted);font-size:11.5px;letter-spacing:1.4px;font-weight:600}
.chaps{flex:1;overflow:auto;padding:0 9px 10px}
.chap{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:9px 12px;margin-bottom:2px;text-align:left;font-size:14.5px}
.chap:hover{background:var(--hover)}
.chap .n{color:var(--muted);font-size:12.5px;flex:none}
.chap.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.chap.on .n{color:var(--blue)}
.chap.all{font-weight:600}
.chap.sub{font-style:italic;color:var(--muted)}
.chap.on.sub{color:var(--blue)}
.chap .n.done{color:var(--green)}
.rv{display:flex;gap:5px;flex-wrap:wrap;padding:0 3px 8px}
.rv button{font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:13px;background:transparent;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.rv button:hover{background:var(--hover);color:var(--text)}
.rv button b{color:var(--text);font-weight:700}
.rv button.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.rv button.on b{color:var(--blue)}
.rv button.zero{opacity:.55}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:12px;line-height:1.55}
.side-foot b{color:var(--text);font-weight:600}

/* question rail */
.rail{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 0 24px;display:flex;flex-direction:column;align-items:center;gap:7px}
.rail-h{color:var(--muted);font-size:11px;letter-spacing:1.4px;font-weight:600;margin-bottom:4px}
.tile{position:relative;width:44px;height:30px;border-radius:5px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.tile:hover{border-color:var(--muted)}
.tile.ok{background:var(--green-tile);border-color:var(--green-tile);color:var(--on-green)}
.tile.bad{background:var(--red-tile);border-color:var(--red-tile);color:#fff}
.tile.pick{background:var(--pick);border-color:var(--pick);color:var(--text)}
.tile.cur{outline:2px solid var(--blue);outline-offset:2px}
.tile.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--flag);border:2px solid var(--panel)}

/* main */
.main{overflow:auto;padding:26px 36px 60px}
.mob{display:none;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:7px 13px;font-size:13.5px;color:var(--text);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.primary{background:var(--blue-btn);border-color:var(--blue-btn);color:var(--on-primary);font-weight:600}
.stats{margin:14px 0 20px;color:var(--muted);font-size:15px}
.stats b{color:var(--text)} .stats .g{color:var(--green)} .stats .r{color:var(--red)}
.stats .note{display:block;margin-top:4px;font-size:13px;color:var(--dim)}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);background:var(--choice);border:1px solid var(--line2);border-radius:6px;padding:2px 9px;margin-left:4px}
.timer.low{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 26px;max-width:1100px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qmeta{color:var(--muted);font-weight:600;font-size:14.5px}
.qmeta b{color:var(--text)}
.qtools{display:flex;gap:7px;flex-wrap:wrap}
.qtools .btn{padding:5px 11px;font-size:13px}
.qtools .btn.flagged{color:var(--flag);border-color:var(--flag-line)}
.qtools .btn:disabled{opacity:.4;cursor:default}
.qtools .btn:disabled:hover{background:transparent}
.stem{font-size:16.5px;line-height:1.75;margin:0 0 18px}
.stem p{margin:0 0 10px}
.stem p:last-child{margin-bottom:0}
.stem img.qimg{margin-top:12px}
.eh p{margin:0 0 8px;line-height:1.7;font-size:15.5px}
.stem mark{background:var(--mark);color:#1a1300;border-radius:2px;padding:0 1px}
.stem.hl-mode{cursor:text}
.stem.hl-mode mark{cursor:pointer}
.stem mark.hl-g,.sw.hl-g{background:#9fe0a0}
.stem mark.hl-b,.sw.hl-b{background:#a9d4ff}
.stem mark.hl-p,.sw.hl-p{background:#ffb8dc}
.stem mark.hl-o,.sw.hl-o{background:#ffc98f}
.sw.hl-y{background:var(--mark)}
.split{display:inline-flex}
.split #hlBtn{border-top-right-radius:0;border-bottom-right-radius:0;display:inline-flex;align-items:center;gap:6px}
.split .caret{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px;padding-left:7px!important;padding-right:7px!important}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.hlmenu .pop{display:none;left:0;right:auto;min-width:200px}
.hlmenu.open .pop{display:block}
.hlpop .mi{gap:10px}
.hlpop .sw{width:16px;height:16px}
.gmenu{position:relative}
.gmenu .pop{display:none;left:0;right:auto;width:min(380px,86vw);padding:10px}
@media (max-width:640px){.gmenu .pop{left:auto;right:0}}
.gmenu.open .pop{display:block}
.split #gBtn{border-top-right-radius:0;border-bottom-right-radius:0;display:inline-flex;align-items:center;gap:6px}
.gform{display:flex;gap:6px}
.gform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:8px 10px;font:inherit;font-size:14px}
.gform input:focus{outline:none;border-color:var(--blue)}
.gnote{font-size:12px;color:var(--muted);margin:8px 2px 2px;line-height:1.45}
.gbubble{position:fixed;z-index:60;display:none;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.35);padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transform:translate(-50%,-100%)}
.gbubble.on{display:block}
.gbubble:hover{border-color:var(--blue);color:var(--blue)}
.hgoogle{display:flex;gap:8px;margin:-8px 0 18px}
.hgoogle input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:10px 14px;font:inherit;font-size:14px}
.hgoogle input:focus{outline:none;border-color:var(--blue)}
.app.focus .gmenu,.app.focus .gbubble{display:none!important}
.c100links{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.c100btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);cursor:pointer;width:100%}
.c100btn:hover{border-color:#7a4bd1;background:var(--hover)}
.c100btn .cn{flex:none;min-width:42px;height:42px;border-radius:9px;background:#5b2a9e;color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.c100btn .ct{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.c100btn .ct small{color:var(--muted);font-size:12.5px}
.c100btn .go{flex:none;color:#8b5cf6;font-weight:700;font-size:13px}
.rvbig .v.c1{color:#8b5cf6}
.c100v{position:fixed;inset:0;z-index:80;background:rgba(10,12,16,.82);display:flex;flex-direction:column}
.c100v[hidden]{display:none}
.c100bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line2)}
.c100t{flex:1;min-width:0;display:flex;flex-direction:column}
.c100t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c100t small{color:var(--muted);font-size:12.5px}
.c100jump{max-width:260px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font:inherit;font-size:13px}
.c100body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px}
.c100body img{max-width:min(1100px,100%);height:auto;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.c100load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ddd;font-size:15px}
@media (max-width:640px){.c100jump{display:none}.c100body{padding:8px}}
.hlhint{font-size:12px;color:var(--muted);padding:4px 11px 6px;line-height:1.4}
.qimg{display:block;max-width:100%;max-height:440px;border-radius:6px;border:1px solid var(--line);margin:4px 0 20px;background:#fff;cursor:zoom-in}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;align-items:center;gap:14px;background:var(--choice);border:1px solid var(--line2);border-radius:7px;padding:11px 14px;cursor:pointer;user-select:none}
.ch:hover{background:var(--choice-h)}
.ch .L{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.ch .T{flex:1;font-size:15.5px;line-height:1.45}
.ch .x{flex:none;background:none;border:none;color:var(--dim);font-size:18px;padding:2px 6px;border-radius:4px;line-height:1}
.ch .x:hover{color:var(--text);background:var(--line)}
.ch.sel{border-color:var(--blue);background:var(--blue-bg)} .ch.sel .L{background:var(--blue);border-color:var(--blue);color:var(--on-primary)}
.ch.struck .T .tx{text-decoration:line-through;color:var(--dim)}
.ch.hasw{align-items:flex-start}
.ch.hasw .L{margin-top:1px}
.ch .wi{display:block;margin-top:5px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.ch.right .wi{color:var(--text);opacity:.85}
.ch.done{cursor:default}
.ch.right{border-color:var(--green);background:var(--green-bg)} .ch.right .L{background:var(--green);border-color:var(--green);color:var(--on-green)}
.ch.wrong{border-color:var(--red);background:var(--red-bg)} .ch.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.ch .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px}
.ch.right .tag{color:var(--green);background:var(--tag-ok)} .ch.wrong .tag{color:var(--red);background:var(--tag-bad)}
.nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.nbtn{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:10px 22px;font-weight:600;font-size:15px}
.nbtn:hover:not(:disabled){background:var(--hover)}
.nbtn:disabled{opacity:.4;cursor:default}
.nbtn.primary{background:var(--blue-btn);border-color:var(--blue-btn);color:var(--on-primary)}
.nbtn.primary:hover:not(:disabled){filter:brightness(1.12);background:var(--blue-btn)}
.nbtn.okb{border-color:var(--green);color:var(--green)} .nbtn.badb{border-color:var(--red);color:var(--red)}
.timednote{margin-top:14px;color:var(--muted);font-size:13.5px}
.paused{text-align:center;padding:50px 20px}
.paused h3{margin:0 0 8px;font-size:22px}
.paused p{color:var(--muted);margin:0 0 20px}

.reveal-ans{margin-top:4px;padding:14px 16px;border-radius:7px;border:1px solid var(--green);background:var(--green-bg);font-size:17px;font-weight:700;color:var(--green)}

/* explanation */
.exp{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.verdict{font-weight:700;font-size:16px;margin-bottom:6px}
.verdict.g{color:var(--green)} .verdict.r{color:var(--red)} .verdict.m{color:var(--muted)}
.exp h4{margin:18px 0 8px;font-size:12px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.exp p{margin:0;line-height:1.7;font-size:15.5px}
.exp p.pre{white-space:pre-line}
.badge.xp{color:var(--red);border-color:var(--red)}
.badge.shetty{color:var(--teal);border-color:var(--teal)}
.badge{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--badge-fg);border:1px solid var(--badge-line);background:var(--badge-bg);border-radius:10px;padding:1px 8px;vertical-align:1px}
.srcnote{margin-top:14px;color:var(--muted);font-size:13.5px;font-style:italic}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.why li{display:flex;gap:10px;line-height:1.55;font-size:15px;padding:9px 12px;border-radius:6px;background:var(--why-bg);border:1px solid var(--line)}
.why li .k{flex:none;font-weight:700;width:18px}
.why li.c{border-color:var(--green-line)} .why li.c .k{color:var(--green)}
.why li.n .k{color:var(--red)}
.why li .ct{color:var(--text);font-weight:600}
.why li .wt{color:var(--wt)}
.keynote{margin-top:16px;padding:10px 13px;border-left:3px solid var(--flag);background:var(--key-bg);color:var(--key-fg);font-size:14px;line-height:1.55;border-radius:0 6px 6px 0}
.eimgs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.eimgs img{max-height:260px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in}

/* notes box */
.notes{margin-top:22px}
.notes .nh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.notes .nh b{letter-spacing:1.4px;font-size:12.5px}
.notes textarea{width:100%;min-height:110px;background:var(--choice);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:12px 14px;font:inherit;font-size:15px;resize:vertical}
.notes textarea:focus{outline:none;border-color:var(--blue)}

/* pages (builder, notes, search, report) */
.bcourses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.bcx{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.35}
.bcx.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.bcx.off{opacity:.5;cursor:default}
.bcx input{margin-top:3px}
.bch{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.bch:first-of-type{margin-top:0}
.page{max-width:1100px}
.page h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.3px}
.page .sub{color:var(--muted);margin:0 0 22px;line-height:1.55}
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.box h3{margin:0 0 14px;font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.bsec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.bsec>label{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.bsec .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px}
.bsec details{margin-top:6px}
.bsec summary{cursor:pointer;color:var(--blue);font-size:13px;padding:3px 0}

/* course tabs */
.ctabs{display:flex;gap:4px;padding:0 12px 12px}

.noq{color:var(--muted);font-size:13.5px;line-height:1.55;padding:6px 12px 12px}

/* sidebar: home + collapsible sections */
.brand{cursor:pointer}
.chap.home{font-weight:600;margin-top:10px}
.more{background:none;border:none;color:var(--blue);font-size:12.5px;padding:4px 12px 8px;text-align:left}
.sec{border-radius:8px;margin-bottom:3px}

/* bet spot + chips */
.bjspot{position:absolute;left:400px;top:488px;width:80px;height:80px;border-radius:50%;border:2px solid #e7c66b99;box-shadow:inset 0 0 0 6px rgba(231,198,107,.12)}
.bjspot span{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:10px;letter-spacing:.2em;color:#e7c66bbb;font-family:Georgia,serif}
.bjstack{position:absolute;width:46px;height:46px}
.bjchp{position:absolute;left:0;width:46px;height:46px;border-radius:50%;border:5px dashed rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.35);display:grid;place-items:center;font:800 11px/1 Inter,system-ui,sans-serif;color:#fff}
.bjchp.c10,.bjchip.c10,.bjrack i.c10{background:#1f6fd1}.bjchp.c25,.bjchip.c25,.bjrack i.c25{background:#2e9b47}
.bjchp.c50,.bjchip.c50,.bjrack i.c50{background:#d33a2c}.bjchp.c100,.bjchip.c100,.bjrack i.c100{background:#1c1c1c}
.bjrack i.c5{background:#e8e4d8}.bjrack i.c500{background:#7b3fb5}
/* dealer's hand */
.bjdealer{position:absolute;left:0;top:0;width:78px;height:110px;z-index:30;pointer-events:none;will-change:transform}
.bjdealer .held{position:absolute;inset:0}
.bjdealer .held .bjc{left:0;top:0}
.bjarm{position:absolute;left:-19px;top:-76px;width:104px;height:152px;transform-origin:58px 100px;will-change:transform}
.bjarm .sleeve{position:absolute;left:35px;bottom:146px;width:44px;height:700px;background:linear-gradient(90deg,#08080a,#2a2a30 40%,#1a1a1f 60%,#08080a);box-shadow:0 0 8px rgba(0,0,0,.5)}
.bjarm svg{position:absolute;left:0;top:0;width:104px;height:152px;overflow:visible;filter:drop-shadow(0 8px 7px rgba(0,0,0,.42))}
/* controls under the table */
.bjctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:16px auto 0;max-width:880px;background:linear-gradient(180deg,#3a1f10,#2a160b);border:1px solid #5a3420;border-radius:16px;padding:12px 14px}
.bjchip{width:54px;height:54px;border-radius:50%;border:5px dashed rgba(255,255,255,.85);font-weight:800;color:#fff;cursor:pointer;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.45);transition:transform .12s}
.bjchip:hover:not(:disabled){transform:translateY(-3px)}
.bjchip:disabled{opacity:.3;cursor:not-allowed}
.bjbtn{background:#f3efe2;color:#2a160b;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.bjbtn.go{background:#e7c66b}
.bjbtn.ghost{background:rgba(255,255,255,.1);color:#f3efe2;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.bjbtn:disabled{opacity:.35;cursor:not-allowed}
.bjstats{display:flex;gap:18px;justify-content:center;margin-top:10px;color:var(--muted);font-size:13.5px}
.bjstats b{color:var(--text)}
.bjnote{margin-top:8px;font-size:12.5px;text-align:center}
/* leaderboard */
.bjlb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px}
.bjlb h3{margin:0 0 2px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.bjlb h3 button{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}
.bjlb .lbsub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.bjlbr{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:13.5px}
.bjlbr:nth-child(odd){background:rgba(127,127,127,.06)}
.bjlbr .rk{font-weight:800;color:var(--muted);text-align:center}
.bjlbr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bjlbr .nm small{display:block;color:var(--muted);font-size:11.5px}
.bjlbr .bk{font-weight:800;font-variant-numeric:tabular-nums}
.bjlbr.me{background:var(--acc-bg)!important;outline:1px solid var(--acc)}
.bjlbr.g1 .rk{color:#e7b416}.bjlbr.g2 .rk{color:#a8b3bd}.bjlbr.g3 .rk{color:#c27c3e}
.bjlb .lbme{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.bjlb .lbme b{color:var(--text)}
@media (max-width:600px){.bjctl{gap:8px;padding:10px}.bjchip{width:46px;height:46px;font-size:12px}.bjbtn{padding:10px 14px}}
/* sign-in lock: the app stays hidden until auth.js confirms a signed-in, allowed user */
html.jjlock #app{visibility:hidden!important}
.jjlockmsg{position:fixed;inset:0;z-index:9995;display:grid;place-items:center;text-align:center;padding:24px;background:#1b3550;color:#e6edf3;font:15px/1.5 Inter,system-ui,sans-serif}
.jjlockmsg b{display:block;font-size:20px;margin-bottom:6px}
.jjlockmsg button{margin-top:14px;background:#fff;color:#1b3550;border:none;border-radius:9px;padding:10px 18px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
/* welcome screen */
.splash{position:fixed;inset:0;z-index:9999;background:#1b3550;background:radial-gradient(ellipse at 50% 40%,#22436a 0%,#1b3550 55%,#152a40 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,6vh,56px);padding:24px;transition:opacity .45s ease,visibility .45s;color:#fff}
.splash.out{opacity:0;visibility:hidden}
@property --spa{syntax:'<angle>';inherits:false;initial-value:0deg}
.splogo{position:relative;width:min(640px,86vw);aspect-ratio:1000/303}
.splogo img{position:absolute;inset:0;width:100%;height:100%;display:block}
.splogo .sp-tx{clip-path:inset(0 0 0 36.5%);-webkit-mask:linear-gradient(90deg,#000 40%,transparent 60%) 100% 0/250% 100% no-repeat;mask:linear-gradient(90deg,#000 40%,transparent 60%) 100% 0/250% 100% no-repeat;opacity:0;transform:translateY(6px);animation:spWipe .7s .95s ease forwards}
.splogo .sp-ic{clip-path:inset(0 63.5% 0 0);opacity:0;animation:spFade .45s .85s ease forwards}
.splogo .sp-ol{width:36.5%;-webkit-mask:conic-gradient(from 200deg,#000 var(--spa),transparent 0);mask:conic-gradient(from 200deg,#000 var(--spa),transparent 0);filter:drop-shadow(0 0 6px #6ee6dc);animation:spSweep .9s .15s cubic-bezier(.5,0,.3,1) forwards,spOut .4s 1.05s forwards}
.splogo .sp-ecg{position:absolute;left:-30%;width:160%;top:33%;height:82.6%;pointer-events:none;overflow:visible}
.splogo .sp-ecg path{fill:none;stroke:#5cd6cb;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1700;stroke-dashoffset:1700;opacity:.5;filter:drop-shadow(0 0 6px #5cd6cb);vector-effect:non-scaling-stroke;animation:spTrace .85s 1.65s cubic-bezier(.3,0,.7,1) forwards,spOut .45s 2.55s forwards}
.splogo.beat{animation:spBeat .45s ease-out}
@keyframes spSweep{to{--spa:360deg}}
@keyframes spFade{to{opacity:1}}
@keyframes spOut{to{opacity:0}}
@keyframes spWipe{to{-webkit-mask-position:0 0;mask-position:0 0;opacity:1;transform:none}}
@keyframes spTrace{to{stroke-dashoffset:0}}
@keyframes spBeat{0%{transform:scale(1)}30%{transform:scale(1.06);filter:drop-shadow(0 0 18px rgba(79,184,176,.55))}100%{transform:scale(1)}}
.splash .enter{width:68px;height:68px;border-radius:50%;border:2px solid #4fb8b0;background:rgba(79,184,176,.12);color:#5cc6bd;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s,box-shadow .2s;animation:spIn .6s 2.6s ease both}
.splash .enter:hover,.splash .enter:focus-visible{background:#4fb8b0;color:#14283d;transform:translateX(2px);box-shadow:0 0 0 6px rgba(79,184,176,.18);outline:none}
.splash .enter svg{animation:spBob 1.8s 3.2s ease-in-out infinite}
.splash .lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8fb3c9;margin-top:-14px;animation:spIn .7s .35s ease both}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spBob{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.splash img,.splash .enter,.splash .lbl,.splash .enter svg,.splogo{animation:none!important}.splogo .sp-tx,.splogo .sp-ic{opacity:1;transform:none;-webkit-mask:none;mask:none}.splogo .sp-ol,.splogo .sp-ecg{display:none}}

.brand .lg-mark{width:80px;height:64px}
.brand .lg-word{width:136px;height:27px}
.brand{text-align:center;padding:20px 18px 12px}
.brand .bcourse{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.brand h1{font-size:14.5px;font-weight:700;letter-spacing:0}
.brand p{margin-top:2px;font-size:12.5px}
.mob{align-items:center;justify-content:space-between;gap:12px}
.mob .jjlogo{flex-direction:row;gap:9px;cursor:pointer}
.mob .lg-mark{width:40px;height:32px}
.mob .lg-word{width:96px;height:19px}

.bpcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid #e2b83e;border-radius:10px;padding:14px 18px;margin:14px 0 6px;color:var(--text)}
.bpcard:hover{border-color:#e2b83e;background:var(--hover)}
.bpcard .bpi{flex:none;color:var(--muted);display:grid;place-items:center}
.bpcard .bpt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.bpcard .bpt b{font-size:16px}
.bpcard .bpt small{color:var(--muted);font-size:13px}
.bpcard .go{flex:none;font-weight:700;color:#c99a1a}

/* ===== USMLE-style interface ===== */
.ubar,.ufoot{position:fixed;left:0;right:0;z-index:30;background:#1b3550;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
:root:not([data-theme="light"]) .ubar,:root:not([data-theme="light"]) .ufoot{background:#14243a;border-color:#2a3a52}
.ubar{top:0;min-height:58px;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.ufoot{bottom:0;min-height:50px;justify-content:space-between;font-size:13.5px;border-top:1px solid rgba(255,255,255,.08)}
.ubar[hidden],.ufoot[hidden]{display:none}
.ubar .ul,.ubar .ur,.ufoot .fl,.ufoot .fr{display:flex;align-items:center;gap:4px;min-width:0}
.ubar .ul{gap:12px}
.uitem{display:flex;flex-direction:column;line-height:1.25;white-space:nowrap}

.umark{display:flex;align-items:center;gap:8px;background:none;border:none;color:#fff;font-size:14px;padding:8px 6px;border-radius:6px}

.uc{display:flex;gap:6px}
.uarrow{width:46px;height:42px;border-radius:8px;border:none;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center}
.uarrow:hover:not(:disabled){background:rgba(255,255,255,.24)}
.uarrow:disabled{opacity:.35;cursor:default}
.ubtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:50px;padding:0 9px;border:none;border-radius:7px;background:none;color:#fff;font-size:12px;white-space:nowrap}
.ubtn:hover{background:rgba(255,255,255,.1)}
.ubtn.on{background:rgba(255,255,255,.2)}
.ubtn .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:-1px}
.usplit{display:inline-flex;align-items:center}
.ucaret{height:50px;width:20px;border:none;background:none;color:#c3d2e2;font-size:11px;border-radius:6px;padding:0}
.ucaret:hover{background:rgba(255,255,255,.1);color:#fff}
.ubar .pop,.ufoot .pop{color:var(--text)}
.ubar .hlmenu .pop,.ubar .gmenu .pop{left:auto;right:0}
.ubar .menu>.btn{border:none;background:none;color:#fff;flex-direction:column;gap:3px;height:50px;font-size:12px;padding:0 9px;justify-content:center}
.ubar .menu>.btn::after{content:"Text";font-size:12px}
.ubar .menu>.btn:hover,.ubar .menu>.btn.on{background:rgba(255,255,255,.12);color:#fff}
.ufoot .ulab{color:#c3d2e2}
.ufoot .ph{display:none;margin-right:3px}
.ufoot b{font-weight:700}
.ufoot .usep{width:1px;height:18px;background:rgba(255,255,255,.25);margin:0 8px}
.ufoot b.low,.ufoot #timer.low{color:#ffb4ab}
.ufbtn{height:38px;padding:0 13px;border:none;border-radius:6px;background:none;color:#fff;font-size:13.5px;white-space:nowrap}
.ufbtn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.ufbtn:disabled{opacity:.4;cursor:default}
.ufbtn.on{background:rgba(255,255,255,.18)}
.ufbtn.solid{background:#fff;color:#1b3550;font-weight:700}
.ufbtn.solid:hover{background:#e8eef5}
.ufoot .pop{top:auto;bottom:calc(100% + 8px)}
.app.usmle{grid-template-columns:72px 1fr}
.app.usmle .rail{background:#eef2f6;padding:0;gap:0;align-items:stretch;border-right:1px solid #d5dde6}
:root:not([data-theme="light"]) .app.usmle .rail{background:var(--panel);border-right-color:var(--line)}
.app.usmle .rail-h{display:none}
.app.usmle .tile{width:100%;height:40px;border:none!important;border-radius:0;background:none!important;color:var(--text)!important;font-size:14px;font-weight:400;outline:none!important;display:flex;align-items:center;justify-content:center;gap:4px}
.app.usmle .tile:hover{background:rgba(27,53,80,.07)!important}
.app.usmle .tile.cur{background:#c9daea!important;font-weight:700}
.app.usmle .tile.ok::before,.app.usmle .tile.bad::before{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;line-height:1}
.app.usmle .tile.ok::before{content:"✓";color:var(--green)}
.app.usmle .tile.bad::before{content:"✗";color:var(--red)}
:root:not([data-theme="light"]) .app.usmle .tile.cur{background:#24405f!important}
.app.usmle .tile.flag::after{content:"";position:static;width:9px;height:9px;border:none;border-radius:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 3v18' stroke='%23d98a00' stroke-width='3'/><path d='M5 4h13l-3 4.5 3 4.5H5z' fill='%23d98a00'/></svg>") center/contain no-repeat}
@media (max-width:900px){ .app.usmle .rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid #d5dde6} .app.usmle .tile{width:48px;flex:none} :root:not([data-theme="light"]) .app.usmle .rail{border-bottom-color:var(--line)} }
.app.usmle .side,.app.usmle .mob,.app.usmle #quizView>.top,.app.usmle #stats{display:none!important}
.app.usmle .main{padding:30px 48px 40px}
.app.usmle .card{border:none;background:transparent;padding:0;max-width:900px}
.app.usmle #noteBox{display:none}
.app.usmle.unotes #noteBox:not([hidden]),.app.usmle #noteBox.has:not([hidden]){display:block;max-width:900px;border:1px solid var(--line);background:var(--card);padding:16px 18px}
.app.usmle .stem{font-size:16.5px;max-width:860px}
.umeta{margin:0 0 12px}
.app.usmle .choices{gap:2px;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;max-width:720px;background:var(--card)}
.app.usmle .ch{background:none;border:none;border-radius:5px;padding:7px 8px;gap:10px}
.app.usmle .ch:hover{background:var(--hover)}
.app.usmle .ch.done:hover{background:none}
.app.usmle .ch::before{content:"";flex:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box;display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}
.app.usmle .ch.sel::before{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--card)}
.app.usmle .ch.right::before{content:"✓";border:none;color:var(--green);font-size:18px}
.app.usmle .ch.wrong::before{content:"✗";border:none;color:var(--red);font-size:18px}
.app.usmle .ch .L{display:inline-flex;width:auto;height:auto;border:none!important;background:none!important;color:var(--text)!important;font-size:15.5px;font-weight:600;border-radius:0}
.app.usmle .ch .L::after{content:"."}
.app.usmle .ch .T{font-size:15.5px}
.app.usmle .ch.sel{background:var(--blue-bg)}
.app.usmle .ch.right,.app.usmle .ch.wrong{background:none}
.app.usmle .ch.right .L,.app.usmle .ch.right .tx{color:var(--green)!important;font-weight:600}
.app.usmle .ch.wrong .L,.app.usmle .ch.wrong .tx{color:var(--red)!important}
.app.usmle .ch .tag{display:none}
.app.usmle .ch .x{opacity:0}
.app.usmle .ch:hover .x,.app.usmle .ch.struck .x{opacity:1}
.app.usmle .card #prevBtn,.app.usmle .card #nextBtn{display:none}
.app.usmle .nav{margin-top:18px}
.app.usmle .exp>.verdict,.app.usmle .exp .ttime{display:none}
.ustrip{display:flex;max-width:720px;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin:22px 0 4px;background:var(--card)}
.ustrip .us{flex:1;padding:11px 16px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:2px;min-width:0}
.ustrip .us:first-child{border-left:none}
.ustrip .us b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ustrip .us span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ustrip .us.r{background:var(--red-bg)} .ustrip .us.r b{color:var(--red)}
.ustrip .us.g{background:var(--green-bg)} .ustrip .us.g b{color:var(--green)}
.ustrip .us.m b{color:var(--muted)}
@media (max-width:1180px){ .ubtn{min-width:40px;padding:0 7px} .ubtn span.lb{display:none} .ubar .menu>.btn::after{content:none} }
@media (max-width:900px){
  .app.usmle,.app.usmle.norail{grid-template-columns:1fr}
  .app.usmle .main{padding:16px 16px 30px}
  .ubar{flex-wrap:wrap;padding:4px 6px;gap:2px}
  .ubar .ul{gap:4px;flex:1}
  .ubar .ur{order:3;width:100%;overflow-x:auto;justify-content:space-between}
  .uitem small{display:none}
  .uarrow{width:42px;height:40px}
  .ubtn,.ucaret,.ubar .menu>.btn{height:42px}
  .ufoot{flex-wrap:wrap;padding:4px 8px;gap:4px}
  .ufoot .ulab,.ufoot .usep,.ufoot .hidem{display:none}
  .ufoot .ph{display:inline}
  .ufbtn{height:36px;padding:0 9px}
  .ustrip{flex-wrap:wrap} .ustrip .us{flex:1 1 40%}
}

.dsc .dbar{max-width:none;margin:12px 0 14px}
.dsca{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.dsca .dpill{margin:0}
.dtr{display:flex;justify-content:space-between;gap:10px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;padding:8px 0;text-align:left}
.dtr:last-child{border-bottom:none}.dtr:hover span{color:var(--acc)}.dtr em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
@media (max-width:1100px){.dsecg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.dstrip{grid-template-columns:repeat(3,minmax(0,1fr))}.dst:nth-child(3){border-right:none}.dst:nth-child(-n+3){border-bottom:1px solid var(--line)}.dsecg{grid-template-columns:1fr}.dban{flex-direction:column;align-items:flex-start}}

.nbbuild{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:4px 0 22px}
.nbbh h3{margin:0;font-size:17px}.nbbh .sub{margin:2px 0 6px}
.nbrow{margin-top:16px}
.nblab{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.nblab span{font-weight:500;letter-spacing:0;text-transform:none}.nblab span button{background:none;border:none;color:var(--acc);cursor:pointer;font:inherit;padding:0}
.nbsubs{display:flex;flex-wrap:wrap;gap:8px}
.nbsubj{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.nbsubj b{color:var(--muted);font-weight:600}
.nbsubj .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:#fff}
.nbsubj.on{border-color:var(--acc);background:var(--acc-bg)}.nbsubj.on .ck{background:var(--acc);border-color:var(--acc)}
.nbseg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.nbseg button{background:none;border:none;color:var(--muted);border-radius:7px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.nbseg button b{font-weight:600;opacity:.75;margin-left:2px}
.nbseg button.on{background:var(--acc-bg);color:var(--text);box-shadow:inset 0 0 0 1px var(--acc)}
.nbseg button:disabled{opacity:.4;cursor:not-allowed}
.nbmode{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.nbmode button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--text);cursor:pointer}
.nbmode button b{display:block;font-size:14.5px}.nbmode button small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.nbmode .nbmr{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:2px}
.nbmode button.on{border-color:var(--acc);background:var(--acc-bg)}.nbmode button.on .nbmr{border:5px solid var(--acc)}
.nbinline{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.nbinline .field input{width:120px}.nbinline .field select{width:180px}
.nbchk{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;margin-top:14px}
.nbinline .nbchk{margin-top:0;padding-bottom:9px}
.nbfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.nbfoot .avail{color:var(--muted);font-size:13.5px}.nbfoot .avail b{color:var(--text)}
.nbgo{padding:10px 18px;font-size:15px}
.nba{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.nbtests{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.nbov{position:fixed;inset:0;z-index:500;background:rgba(1,4,9,.6);display:grid;place-items:center;padding:16px;animation:nbFade .15s ease}
.nbdlg{width:min(560px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.nbdh{display:flex;justify-content:space-between;align-items:flex-start}.nbdh h3{margin:2px 0 0;font-size:19px}
.nbx{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:32px;height:32px;cursor:pointer}
.nbdlg .nbmode{grid-template-columns:1fr 1fr}
@keyframes nbFade{from{opacity:0}to{opacity:1}}
@media (max-width:640px){.nbmode,.nbdlg .nbmode{grid-template-columns:1fr}.nbfoot{flex-direction:column;align-items:stretch}.nbgo{width:100%}}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:6px}
.nbcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.nbtop{display:flex;justify-content:space-between;align-items:center}
.nbsub{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.nbpct{font-weight:700;font-size:14px}.nbpct.g{color:var(--green)}.nbpct.y{color:var(--yellow,#d29922)}.nbpct.r{color:var(--red)}
.nbname{font-size:16px}.nbmeta{color:var(--muted);font-size:12.5px}.nbmeta .r{color:var(--red)}
.nbnote{color:var(--dim,var(--muted));font-size:12px}
.nba{margin-top:6px}
.nbch{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.cbadge.nbtag{background:rgba(210,153,34,.16);color:#e3b341;border-color:rgba(210,153,34,.4)}
.eh .nbhint{color:var(--muted);font-size:.95em;margin-top:8px}
.gdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gdcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gdi{width:38px;height:38px;border-radius:9px;background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;flex:none}
.gdt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gdt b{font-size:14.5px}.gdt small{color:var(--muted);font-size:12.5px;line-height:1.35}.gdm{font-size:11.5px;color:var(--dim)}
.gda{display:flex;flex-direction:column;gap:6px;flex:none}.gda .dpill{margin:0;text-align:center;text-decoration:none}
.dtools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.dtool{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;color:var(--text);font:inherit}
.dtool:hover{border-color:var(--acc);background:var(--hover)}
.dtool .dti{width:42px;height:42px;border-radius:10px;background:var(--acc-bg);color:var(--acc);display:grid;place-items:center;flex:none}
.dtool .dti svg{width:22px;height:22px}
.dtool b{display:block;font-size:15px}
.dtool small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.dtool .go{margin-left:auto;color:var(--acc);font-weight:650;white-space:nowrap}
@media (max-width:900px){.dtools{grid-template-columns:1fr}}
@media (max-width:900px){
  .dgrid{grid-template-columns:1fr 1fr}
  .dres{grid-column:span 2}
  .dperf{flex-wrap:wrap;gap:18px}
  .dkv{flex-basis:100%}
  .dash .dtop{flex-direction:column}
}
@media (max-width:640px){ .dtbl .hm{display:none} }
.main,#pageView,.dash,.dpanel,.dgrid>*{min-width:0}
.dtw{max-width:100%}
</style>

<script>
(function(){
// =====================================================================
// Data
// =====================================================================
// ---- Courses (summatives). To add one, add it here, then give its sections course:"<id>". ----
// Each section's prefix must be unique across the whole site (it's part of every saved question ID).
const COURSES = [
  {id:"fbs", name:"FBS", full:"Foundations of Basic Sciences"},
  {id:"msk", name:"MSK", full:"Musculoskeletal"},
  {id:"crs", name:"CRS", full:"Cardiovascular & Respiratory Systems"}
];
const SECTIONS = [
  {course:"msk", name:"Histology", all:"All Histology", prefix:"q", topics:window.TOPICS, qs:window.QUESTIONS,
   extra:[{name:"Review Slides Practice (new)", f:q=>q.src==="rev"}]},
  {course:"msk", name:"MSK Physiology", all:"All Physiology", prefix:"p", topics:window.PHYSIO_TOPICS, qs:window.PHYSIO_QUESTIONS,
   extra:[{name:"MSK Review 3 (skeletal)", f:q=>q.src==="rev3"}, {name:"MSK Review 4 (smooth)", f:q=>q.src==="rev4"}]},
  {course:"msk", name:"Biochemistry", all:"All Biochemistry", prefix:"b", topics:window.BCHM_TOPICS, qs:window.BCHM_QUESTIONS,
   extra:[{name:"From the Document", f:q=>q.src==="doc"}, {name:"Blueprint Practice (new)", f:q=>q.src==="new"}]},
  {course:"msk", name:"Anatomy (BRS)", all:"All Anatomy", prefix:"a", topics:window.ANAT_TOPICS, qs:window.ANAT_QUESTIONS,
   extra:[{name:"All Upper Limb", f:q=>q.limb==="Upper Limb"}, {name:"All Lower Limb", f:q=>q.limb==="Lower Limb"}]},
  {course:"msk", name:"MSK Embryology", all:"All Embryology", prefix:"e", topics:window.EMB_TOPICS, qs:window.EMB_QUESTIONS},
  {course:"fbs", name:"FBS Physiology", all:"All FBS Physiology", prefix:"fp", topics:window.FBS_PHYS_TOPICS, qs:window.FBS_PHYS_QUESTIONS,
   extra:[{name:"FBS Review 1", f:q=>q.src==="r1"}, {name:"Class Review Qs", f:q=>q.src==="cls"}, {name:"RMP & AP Questions", f:q=>q.src==="rmp"}]},
  {course:"fbs", name:"FBS Cell Biology", all:"All Cell Biology", prefix:"fc", topics:window.FBS_CB_TOPICS, qs:window.FBS_CB_QUESTIONS,
   extra:[{name:"Shetty Practice Q's (from the slides)", f:q=>q.shetty}, {name:"CB1 Quiz – Cell Organelles", f:q=>q.src==="cb1"}, {name:"New NBME-style Q's", f:q=>q.src==="fcn"}]},
  {course:"fbs", name:"FBS Biochemistry", all:"All FBS Biochemistry", prefix:"fb", topics:window.FBS_BC_TOPICS, qs:window.FBS_BC_QUESTIONS,
   extra:[{name:"Shetty Practice Q's (from the slides)", f:q=>q.shetty}, {name:"New NBME-style Q's", f:q=>q.src==="fbn"}]},
  {course:"fbs", name:"FBS Embryology", all:"All FBS Embryology", prefix:"fe", topics:window.FBS_EMB_TOPICS, qs:window.FBS_EMB_QUESTIONS,
   extra:[{name:"Exam Points (red + exam questions)", f:q=>q.xp}]},
  {course:"fbs", name:"Anki Deck Practice Q's", all:"All Anki Deck Q's", prefix:"fa", topics:window.FBS_ANKI_TOPICS, qs:window.FBS_ANKI_QUESTIONS},
  {course:"crs", name:"CRS Embryology", all:"All CRS Embryology", prefix:"ce", topics:window.CRS_EMB_TOPICS, qs:window.CRS_EMB_QUESTIONS}
].concat((window.NBME_QUIZZES||[]).map(z=>({course:z.course, name:z.name, all:z.name, prefix:z.prefix, topics:[], qs:z.qs, nbme:true, subject:z.subject, note:z.note})))
 .filter(s=>s.qs && s.qs.length);

const Q = [], STATIC = [];
SECTIONS.forEach(sec=>{
  const co = sec.course;
  const qs = sec.qs.map((q,i)=>Object.assign({id:sec.prefix+(i+1), sec:sec.name, pfx:sec.prefix, num:i+1, course:co}, sec.nbme?{nbme:true}:{}, q));
  sec.items = qs; Q.push(...qs);
  STATIC.push({key:sec.prefix+":all", name:sec.all, sec:sec.name, pfx:sec.prefix, course:co, head:true, ids:qs.map(q=>q.id), kind:"static", nbme:!!sec.nbme});
  sec.topics.forEach(t=>{ const ids=qs.filter(q=>q.t===t).map(q=>q.id); if(ids.length) STATIC.push({key:sec.prefix+":t:"+t, name:t, sec:sec.name, pfx:sec.prefix, course:co, ids, kind:"static"}); });
  (sec.extra||[]).forEach(x=>{ const ids=qs.filter(x.f).map(q=>q.id); if(ids.length) STATIC.push({key:sec.prefix+":x:"+x.name, name:x.name, sec:sec.name, pfx:sec.prefix, course:co, ids, sub:true, kind:"static"}); });
});
const COURSE_BY_ID = Object.fromEntries(COURSES.map(c=>[c.id,c]));
// NBME-style quizzes live in their own bank (NBME dashboard): kept out of the course sections, counts, review lists and test builder.
COURSES.forEach(c=>{ c.sections = SECTIONS.filter(s=>s.course===c.id && !s.nbme); c.items = Q.filter(q=>q.course===c.id && !q.nbme); c.nbme = SECTIONS.filter(s=>s.course===c.id && s.nbme); });
const NBME_SECS = SECTIONS.filter(s=>s.nbme);
const STATIC_BY_KEY = Object.fromEntries(STATIC.map(c=>[c.key,c]));
const SEC_BY_PFX = Object.fromEntries(SECTIONS.map(s=>[s.prefix,s]));
const byId = Object.fromEntries(Q.map(q=>[q.id,q]));
// Expanded explanations (xp-*.js): q.x = full explanation HTML, q.w = longer per-choice notes.
if (window.XP) Q.forEach(q=>{ const x = window.XP[q.id]; if (!x) return; if (x.x) q.x = x.x; if (x.w && q.c && x.w.length===q.c.length) q.w = x.w; });
// Link questions to pages of "100 most important D&GA conceptions" (MSK, FBS and CRS).
(function(){
  const C = window.C100; if (!C) return;
  const strip = h => String(h??"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
  Q.forEach(q=>{
    if (q.course!=="msk" && q.course!=="fbs" && q.course!=="crs") return;
    const stem = strip(q.s), rest = [q.c?q.c[q.a]:"", q.ans||"", q.e||"", q.se||"", strip(q.eh), q.key||""].join(" \n ");
    const hit = (r,t)=> r[2].test(t) || (r[3] && r[3].test(t));
    const inStem = C.rules.filter(r=>hit(r,stem)), other = C.rules.filter(r=>!inStem.includes(r) && hit(r,rest));
    const pages = inStem.concat(other).map(r=>r[0]).slice(0,4);
    if (pages.length) q.c100 = pages;
  });
})();
function c100Concept(page){ const C = window.C100; let best = null; for (const c of C.conceptions) { if (c[2] <= page) best = c; } return best; }
function c100Topic(page){ const r = window.C100.rules.find(r=>r[0]===page); return r ? r[1] : ""; }
const LET = "ABCDEFGH";

// =====================================================================
// Storage (+ migration from the first version)
// =====================================================================
const KEY = "msk-summative-v1";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { S = {}; }
S.ans ??= {}; S.sel ??= {}; S.strike ??= {}; S.flag ??= {}; S.notes ??= {}; S.hl ??= {}; S.order ??= {};
S.scr ??= {}; S.qshuf ??= {}; S.posId ??= {}; S.pos ??= {}; S.snap ??= {}; S.tests ??= []; S.testSeq ??= 0;
S.first ??= {}; S.chgq ??= {}; S.ac ??= []; S.qtime ??= {}; S.anki ??= [];
if (!(S.v >= 2)) {
  // chapter positions/scramble used to be stored by list number; move them to chapter keys
  const pos = {}, scr = {};
  Object.keys(S.pos).forEach(k=>{ const c = /^\d+$/.test(k) ? STATIC[+k] : null; if (c) pos[c.key] = S.pos[k]; else pos[k] = S.pos[k]; });
  Object.keys(S.scr).forEach(k=>{ const c = /^\d+$/.test(k) ? STATIC[+k] : null; if (c) scr[c.key] = S.scr[k]; else scr[k] = S.scr[k]; });
  S.pos = pos; S.scr = scr;
  S.cur = (typeof S.chap === "number" && STATIC[S.chap]) ? STATIC[S.chap].key : STATIC[0].key;
  delete S.chap; S.v = 2;
}
if (S.v === 2) {
  // single-course version → courses: everything so far belongs to MSK; "all sections" review lists become MSK's
  const fix = k => String(k).replace(/^all:rv:/, "msk:rv:");
  const move = o => Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[fix(k),v]));
  S.pos = move(S.pos); S.scr = move(S.scr); S.snap = move(S.snap);
  if (S.cur) S.cur = fix(S.cur);
  S.tests.forEach(t=>{ t.course ??= "msk"; });
  S.course = "msk"; S.curBy = {msk: S.cur};
  S.v = 3;
}
S.course = COURSE_BY_ID[S.course] ? S.course : "msk"; S.curBy ??= {};
function save(){ if (window.JJ_HOLD) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Couldn't save — browser storage is full or blocked"); } }

let view = "home";          // home | quiz | builder | notes | search | report
let reportTest = null;
let mode = null;            // highlight tool: "hl" | null
let qtHidden = false; try { qtHidden = localStorage.getItem("msk-qtimer") === "hide"; } catch(e) {}
// Per-question stopwatch: counts while an unanswered question is on screen (pauses when the tab is hidden).
let qtTicks = 0;
setInterval(()=>{
  if (view!=="quiz" || document.hidden || paused) return;
  const c = chap(); if (!c) return;
  const q = curQ(); if (!q || answered(q, store())) return;
  S.qtime[q.id] = (S.qtime[q.id]||0) + 1;
  const el = document.getElementById("qtime"); if (el) el.textContent = fmtTime(S.qtime[q.id]);
  if (++qtTicks % 5 === 0) save();
}, 1000);
// Highlighter colors. Your last-used color is remembered in this browser.
const HL_COLORS = [{k:"y",name:"Yellow"},{k:"g",name:"Green"},{k:"b",name:"Blue"},{k:"p",name:"Pink"},{k:"o",name:"Orange"}];
let hlColor = "y";
try { const c = localStorage.getItem("msk-hlcolor"); if (HL_COLORS.some(x=>x.k===c)) hlColor = c; } catch(e) {}
let paused = false;
let searchTerm = "", searchChips = [], searchMatch = "any";
function searchTerms(){ const t = searchTerm.trim(), a = searchChips.slice(); if (t.length>=2 && !a.some(x=>x.toLowerCase()===t.toLowerCase())) a.push(t); return a; }
let searchRet = null;
let searchScope = "course"; // "course" = current summative only, "all" = FBS + MSK + CRS
let searchFilter = "all";   // when scope is "all": which summative's results to show ("all" or a course id)       // where you were before searching: {view, key, pos, report}
let showAllTests = false;
let openMenu = null;        // "opts" | "text" | null
let focusOn = false;
const ZOOMS = [[0.92,"Small"],[1,"Default"],[1.12,"Large"],[1.25,"Extra large"],[1.4,"Huge"]];
let zoomV = 1; try { zoomV = +localStorage.getItem("msk-zoom") || 1; } catch(e){}

const $ = id => document.getElementById(id);
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1800); }
function plainS(h){ return plain(String(h??"").replace(/<\/?su[bp]>/g,"")); }
function cTxt(q,i){ return q.chtml ? String(q.c[i]).trim() : esc(String(q.c[i]).trim()); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function plain(h){ return String(h??"").replace(/<img[^>]*>/g," ").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }

// =====================================================================
// Answer status (global record, or a test's own record)
// =====================================================================
function status(q, s){
  s = s || S; const a = s.ans[q.id];
  if (a === undefined) return null;
  if (q.type === "reveal") return a === "ok" ? "ok" : a === "bad" ? "bad" : null;
  return a === q.a ? "ok" : "bad";
}
function answered(q, s){ s = s || S; return q.type==="reveal" ? (s.ans[q.id]==="ok"||s.ans[q.id]==="bad") : s.ans[q.id]!==undefined; }

const REVIEW = [
  {k:"inc",  label:"Incorrect",  icon:"✗", f:q=>status(q,S)==="bad"},

          <div class="pop"><div class="mi-h">SEARCH GOOGLE</div><form class="gform" id="gForm"><input id="gIn" type="search" autocomplete="off" placeholder="Type anything to search…"><button class="btn primary" type="submit">Search</button></form>

    if (shown) h += explanation(q, null, s);
  }
  const shownNow = isReveal ? s.ans[q.id] !== undefined : (done && !timed);

    const inA = S.anki.includes(q.id), n2 = S.anki.length;

    </div>`;
  }
  $("card").innerHTML = h;

function ankiField(html){ return String(html||"").replace(/\t/g," ").replace(/\r?\n/g,"<br>"); }
function ankiImg(src){ const k = String(src||"").replace(/^\.\//,""); const u = (window.IMG && IMG[k]) || (String(src).startsWith("data:") ? src : ""); return u ? `<img src="${u}">` : ""; }
function ankiCard(q){
  const sec = q.sec, cn = COURSE_BY_ID[q.course].name;
  let stem = (q.html ? q.s : esc(q.s)).replace(/<img[^>]*src="([^"]*)"[^>]*>/g, (m, src)=>ankiImg(src));
  let front = stem + (q.img ? "<br>" + ankiImg(q.img) : "");

    front += `<ol type="A" style="text-align:left">` + q.c.map(c=>`<li>${esc(c)}</li>`).join("") + `</ol>`;
    back = `<b>Answer: ${LET[q.a]}. ${esc(q.c[q.a])}</b>`;
  }
  if (q.eh) back += `<br><br>${q.eh}`;
  if (q.se) back += `<br><br>${esc(q.se)}`;
  if (q.e) back += `<br><br>${esc(q.e)}`;
  if (q.x) back += `<br><br>${q.x}`;
  if (q.w && q.type !== "reveal" && !q.x) {
    const lines = q.c.map((c,i)=>i===q.a || !q.w[i] ? "" : `<li><b>${LET[i]}.</b> ${esc(q.w[i])}</li>`).join("");
    if (lines) back += `<br><br><i>Why the others are wrong:</i><ul style="text-align:left">${lines}</ul>`;
  }
  const figs = (q.eimg||[]).concat((q.fig||[]).map(f=>`./${f}.jpg`)).map(ankiImg).filter(Boolean);
  if (figs.length) back += "<br>" + figs.join("<br>");
  if (S.notes[q.id] && S.notes[q.id].trim()) back += `<br><br><b>My note:</b> ${esc(S.notes[q.id])}`;
  back += `<br><br><small>${esc(cn)} · ${esc(sec)} · ${esc(q.t)}</small>`;
  const deck = ["Summative Q-Bank", cn, sec].map(x=>x.replace(/::/g,":")).join("::");

}

function explanation(q, o, s){
  s = s || store();
  let h = `<div class="exp">`;
  if (o) {
    const a = s.ans[q.id], letter = LET[o.indexOf(q.a)];
    if (a === undefined) h += `<div class="verdict m">Not answered. The answer is ${letter}. ${cTxt(q,q.a)}</div>`;
    else { const right = a === q.a; h += `<div class="verdict ${right?"g":"r"}">${right?"Correct.":"Incorrect."} The answer is ${letter}. ${cTxt(q,q.a)}</div>`; }
    const ch = (s.chgq||{})[q.id], tt = S.qtime[q.id];
    if (ch || tt) {
      let line = "";
      if (ch) { const [f,t2] = ch, k = f===q.a ? "cw" : t2===q.a ? "wc" : "ww";
        line += `<span class="chgnote ${k}">You changed your answer from <b>${LET[o.indexOf(f)]}</b> to <b>${LET[o.indexOf(t2)]}</b> — ${k==="cw"?"your first answer was right":k==="wc"?"the change was right":"both were wrong"}.</span>`; }
      if (tt) line += `<span class="ttime">⏱ ${fmtTime(tt)} on this question</span>`;
      h += `<div class="vmeta">${line}</div>`;
    }
  } else {
    const m = s.ans[q.id];
    h += `<div class="verdict ${m==="bad"?"r":"g"}">Answer: ${esc(q.ans)}</div>`;
  }
  if (q.eh) h += `<h4>Explanation</h4><div class="eh">${q.eh}</div>`;
  if (q.ref) h += `<div class="srcnote">Source: ${esc(q.ref)}</div>`;
  if (q.se) h += `<h4>${q.seLabel || "Explanation from the slides"}</h4><p class="pre">${esc(q.se)}</p>`;
  if (q.e) h += `<h4>${q.se ? "More detail" : "Why it's correct"}</h4><p class="pre">${esc(q.e)}</p>`;
  if (q.x) h += `<h4>Breaking it down</h4><div class="xexp">${q.x}</div>`;
  const imgs = (q.eimg||[]).concat((q.fig||[]).map(f=>`./${f}.jpg`));
  if (imgs.length) h += `<h4>${q.fig ? (q.pfx==="ce" ? "Figures from the guide" : "Figures from the slides") : "Figure"}</h4><div class="eimgs">${imgs.map(x=>`<img class="zoom" src="${x}" alt="" loading="lazy">`).join("")}</div>`;
  // (choice-by-choice notes now appear inside each answer choice, above)
  if (!o && q.w && q.w.length) {
    h += `<h4>How to tell it apart</h4><ul class="why">` + q.w.map(t=>`<li class="n"><span class="k">•</span><span class="wt">${esc(t)}</span></li>`).join("") + `</ul>`;
  }
  if (q.c100) h += `<h4>📘 100 D&amp;GA Conceptions (Mavrych)</h4><div class="c100links">` + q.c100.map(p=>{ const c = c100Concept(p);
      return `<button class="c100btn" data-c100p="${p}"><span class="cn">#${c?c[0]:"?"}</span><span class="ct"><b>${esc(c100Topic(p)||c[1])}</b><small>${c?esc(c[1])+" · ":""}page ${p}</small></span><span class="go">Open ›</span></button>`; }).join("") + `</div>`;
  if (q.key) h += `<div class="keynote">${esc(q.key)}</div>`;
  if (q.src==="doc" && !q.given && !q.key) h += `<div class="srcnote">The document doesn't give an answer for this question; the answer here is supplied.</div>`;
  if (q.note) h += `<div class="srcnote">${esc(q.note)}</div>`;
  if (q.src==="new") h += `<div class="srcnote">Written for this site from the exam blueprint — not in the document.</div>`;
  if (q.src==="rev") h += `<div class="srcnote">Written for this site from your professor's histology review slides.</div>`;
  if (q.src==="rev3"||q.src==="rev4") h += `<div class="srcnote">From MSK Review ${q.src==="rev3"?3:4}. The document has no answer key, so the answer and explanation were supplied for this site.</div>`;
  return h + `</div>`;
}

document.addEventListener("keydown", e=>{

// ---------- Google search ----------
function googleOpen(q){
  q = String(q||"").replace(/\s+/g," ").trim(); if (!q) return;
  window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank", "noopener");
}
function decodeText(h){ const d = document.createElement("textarea"); d.innerHTML = plain(h); return d.value.replace(/\s+/g," ").trim(); }
const G_STOP = new Set("a an the of in on at to for from by with and or but is are was were be been being has have had his her their its this that these those which what who whom whose most likely following best next step patient patients man woman boy girl year years old yo presents presented comes came because due after before during while into over about than then there here it he she they them shows shown showed reveals revealed noted found also very most least would will can could should may might does do did not no all any some each one two current currently takes taking daily other otherwise history unit department brought visit visits office clinic physician doctor evaluation examination exam reports states says".split(" "));
// Build a Google query for a question. Google only reads ~32 words, so long vignettes are condensed:
// the actual question sentence + the key words from the rest. After answering, the correct answer is added.
function questionQuery(q){
  const s = store();
  const showAns = !timedActive() && (q.type==="reveal" ? s.ans[q.id]!==undefined : answered(q, s) || timedDone());
  const ans = showAns ? decodeText(q.type==="reveal" ? q.ans : (q.c||[])[q.a]) : "";
  const stem = decodeText(q.s);
  const words = t => t.split(/\s+/).filter(Boolean);
  const LIMIT = 32, ansW = words(ans).slice(0, 12);
  const budget = LIMIT - ansW.length;
  let out;
  if (words(stem).length <= budget) out = words(stem);
  else {
    const sents = stem.match(/[^.?!]+[.?!]*/g) || [stem];
    let qi = sents.length - 1; for (let i = sents.length-1; i >= 0; i--) if (/\?\s*$/.test(sents[i])) { qi = i; break; }
    const kw = t => words(t).map(w=>w.replace(/^[^\w(]+|[^\w%)?]+$/g,"")).filter(w=>w && !G_STOP.has(w.toLowerCase().replace(/[?]/g,"")));
    const seen = new Set(), pick = arr => arr.filter(w=>{ const k = w.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    // The question sentence first, then the sentences closest to it (where the key clue usually is), working backwards.
    const parts = new Array(sents.length).fill(null);
    let left = budget;
    const qk = pick(kw(sents[qi])).slice(-Math.min(16, left)); parts[qi] = qk; left -= qk.length;
    for (let i = qi-1; i >= 0 && left > 0; i--) { const k = pick(kw(sents[i])); parts[i] = k.slice(0, left); left -= parts[i].length; }
    for (let i = qi+1; i < sents.length && left > 0; i++) { const k = pick(kw(sents[i])); parts[i] = k.slice(0, left); left -= parts[i].length; }
    out = parts.filter(Boolean).flat();
  }

// ---------- Search ----------
const SEARCH_IDX = Q.map(q=>({q, fields:[
  ["question", plainS(q.s)], ["choices", (q.c||[]).map(plainS).join(" · ")], ["answer", q.ans||""],
  ["explanation", [plainS(q.eh), q.se, q.e].filter(Boolean).join(" ")]
]}));
function searchQs(terms, scope){
  const ts = terms.map(t=>t.toLowerCase()), res = [];
  SEARCH_IDX.forEach(x=>{
    if ((scope||searchScope)!=="all" && x.q.course !== S.course) return;
    let first = null; const hits = [];
    ts.forEach((t,k)=>{
      for (const [where, txt] of x.fields) {
        const i = txt.toLowerCase().indexOf(t);
        if (i >= 0) { hits.push(terms[k]); if (!first) first = {where, txt, i, len:t.length}; break; }
      }
    });
    if (hits.length && (searchMatch==="any" || hits.length===ts.length)) res.push({q:x.q, hits, ...first});
  });
  return res;

  const d = $("bjDealer"), a = $("bjArm"); if (!d) return;
  const fx = BJ.hx, fy = BJ.hy; BJ.hx = x; BJ.hy = y;
  if (bjReduce() || !d.animate) { bjHandSet(x, y); return; }
  const mx = (fx+x)/2, my = Math.min(fy, y) - 14;   // a slight arc, like a real toss
  const o = {duration:ms, easing:"cubic-bezier(.45,.05,.25,1)", fill:"forwards"};
  d.animate([{transform:`translate(${fx}px,${fy}px)`},{transform:`translate(${mx}px,${my}px)`, offset:.55},{transform:`translate(${x}px,${y}px)`}], o);
  a.animate([{transform:`rotate(${bjHandAngle(fx,fy)}deg)`},{transform:`rotate(${bjHandAngle(mx,my)-4}deg)`, offset:.55},{transform:`rotate(${bjHandAngle(x,y)}deg)`}], o);
  await bjWait(ms);
}
async function bjFlip(c){

  const t = document.createElement("div"); t.innerHTML = bjFace(c); const nel = t.firstElementChild; Object.assign(nel.style, st);
  c.el.replaceWith(nel); c.el = nel;
  if (!bjReduce() && nel.animate) await nel.animate([{transform:"rotateY(-90deg) scale(1.04)"},{transform:"none"}], {duration:170, easing:"ease-out"}).finished.catch(()=>{});
}
async function bjGive(who, down){

  await bjWait(90);

async function bjSweep(){
  const all = [...BJ.p, ...BJ.d].filter(c=>c.el);
  if (all.length && !bjReduce()) {
    await bjHandTo(BJ.d.length ? bjPos("d",0).x+40 : 400, 200, 380);
    all.forEach((c,i)=>{ const x = parseFloat(c.el.style.left), y = parseFloat(c.el.style.top);
      c.el.animate([{transform:"none"},{transform:`translate(${BJ_DISC.x+4-x}px,${BJ_DISC.y+4-y}px) rotate(-6deg)`}], {duration:420, delay:i*25, easing:"cubic-bezier(.5,0,.3,1)", fill:"forwards"}); });
    bjHandTo(BJ_DISC.x+10, BJ_DISC.y+30, 420);

  all.forEach(c=>c.el.remove()); if ($("bjDisc")) $("bjDisc").classList.add("has");

async function bjReveal(){

function bjFly(html, from, to, ms, fade){
  const f = $("bjFelt"); if (!f || bjReduce()) return bjWait(0);
  const el = document.createElement("div"); el.className = "bjstack"; el.innerHTML = html; el.style.left = from.x+"px"; el.style.top = from.y+"px"; el.style.zIndex = 25; f.appendChild(el);
  const an = el.animate([{transform:"none", opacity:1},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px)`, opacity: fade?0:1}], {duration:ms, easing:"cubic-bezier(.45,.05,.25,1)", fill:"forwards"});

}
async function bjPay(res){
  const b = BJ.bet, spot = {x:417, y:505}, rack = {x:417, y:-10}, me = {x:417, y:640}, side = {x:470, y:505};
  $("bjBet").innerHTML = "";

    await Promise.all([bjFly(bjStackHTML(b), spot, spot, 1), bjFly(bjStackHTML(won), rack, side, 520)]);
    await Promise.all([bjFly(bjStackHTML(b), spot, me, 480, true), bjFly(bjStackHTML(won), side, {x:470, y:640}, 480, true)]);
  } else if (res==="push") await bjFly(bjStackHTML(b), spot, me, 480, true);
  else await bjFly(bjStackHTML(b), spot, rack, 520, true);
}
async function bjEnd(res){
  const b = BJ.bet;
  if (res==="bj") { BJ.bank += Math.floor(b*2.5); BJ.msg = "Blackjack! +$" + Math.floor(b*1.5); BJ.cls = "win"; BJ.w++; }
  else if (res==="win") { BJ.bank += b*2; BJ.msg = (bjVal(BJ.d) > 21 ? "Dealer busts! " : "You win! ") + "+$" + b; BJ.cls = "win"; BJ.w++; }
  else if (res==="push") { BJ.bank += b; BJ.msg = "Push — bet returned"; BJ.cls = "push"; }
  else { BJ.msg = (res==="bust" ? "Bust! " : "Dealer wins. ") + "−$" + b; BJ.cls = "lose"; BJ.l++; }
  BJ.hands++; BJ.peak = Math.max(BJ.peak, BJ.bank);
  BJ.phase = "done"; bjUI(); bjSave();
  await Promise.all([bjPay(res), bjHandTo(BJ_REST.x, BJ_REST.y, 520)]);
  if (BJ.doubled) { BJ.bet /= 2; BJ.doubled = false; }
  bjUI();
}
async function bjDealer(){
  await bjReveal();
  while (bjVal(BJ.d) < 17) { await bjGive("d"); await bjWait(250); }
  const p = bjVal(BJ.p), d = bjVal(BJ.d);
  await bjEnd(d > 21 || p > d ? "win" : p===d ? "push" : "lose");
}
async function bjAct(a){
  if (a==="back") { view = "home"; renderAll(); $("main").scrollTo({top:0}); return; }
  if (a==="lbref") { BJ.boardAt = 0; bjBoard(true); return; }
  if (BJ.busy) return;
  if (a.startsWith("bet:")) { const n = +a.slice(4);
    if (BJ.phase==="done") { BJ.phase = "bet"; BJ.bet = 0; BJ.cls = ""; }
    if (BJ.phase==="bet" && BJ.bank >= n) { BJ.bank -= n; BJ.bet += n; BJ.msg = ""; BJ.pend = (BJ.pend||0) + n; bjFly(`<div class="bjchp c${n}"></div>`, {x:417, y:640}, {x:417, y:505 - Math.max(0, bjChipsFor(BJ.bet).length-1)*4}, 280).then(()=>{ BJ.pend -= n; bjUI(); }); }
    bjUI(); return; }
  if (a==="clear" && BJ.phase==="bet") { BJ.bank += BJ.bet; BJ.bet = 0; BJ.msg = "Place your bet"; bjUI(); return; }
  if (a==="refill") { BJ.bank = 1000; BJ.bet = 0; BJ.phase = "bet"; BJ.cls = ""; BJ.msg = "Fresh $1,000 — place your bet"; bjSave(); bjUI(); return; }
  BJ.busy = true;
  try {
    if (a==="deal") {
      if (BJ.phase==="done") { if (BJ.bank < BJ.bet) { BJ.phase = "bet"; BJ.bet = 0; BJ.cls = ""; BJ.msg = "Not enough for that bet — pick a new one"; return; } BJ.bank -= BJ.bet; }
      if (!BJ.bet) return;
      BJ.phase = "deal"; BJ.cls = ""; BJ.msg = ""; BJ.doubled = false; bjUI();
      await bjSweep();
      await bjGive("p"); await bjGive("d"); await bjGive("p"); await bjGive("d", true);
      if (bjIsBJ(BJ.p) || bjIsBJ(BJ.d)) { await bjReveal(); await bjEnd(bjIsBJ(BJ.p) && bjIsBJ(BJ.d) ? "push" : bjIsBJ(BJ.p) ? "bj" : "lose"); return; }
      BJ.phase = "play"; BJ.msg = ""; bjUI();
      await bjHandTo(BJ_WAIT.x, BJ_WAIT.y, 420);
    }
    else if (a==="hit" && BJ.phase==="play") { BJ.phase = "deal"; bjUI(); await bjGive("p"); const v = bjVal(BJ.p);
      if (v > 21) { await bjWait(200); await bjEnd("bust"); return; } if (v===21) { await bjDealer(); return; }
      BJ.phase = "play"; await bjHandTo(BJ_WAIT.x, BJ_WAIT.y, 380); }
    else if (a==="stand" && BJ.phase==="play") { await bjDealer(); return; }
    else if (a==="double" && BJ.phase==="play" && BJ.p.length===2 && BJ.bank >= BJ.bet) {
      BJ.bank -= BJ.bet; BJ.bet *= 2; BJ.doubled = true; BJ.phase = "deal"; bjUI();
      await bjGive("p"); if (bjVal(BJ.p) > 21) { await bjWait(200); await bjEnd("bust"); return; } await bjDealer(); return; }
  } finally { BJ.busy = false; if (view==="bj") bjUI(); }
}
function bjUI(){
  if (view!=="bj" || !$("bjCtl")) return;
  const ph = BJ.phase, play = ph==="play", busy = ph==="deal" || ph==="dealer" || BJ.busy && ph!=="play", done = ph==="done";
  const holeDown = BJ.d.length > 1 && (ph==="play" || ph==="deal");
  const dUp = BJ.d.filter(c=>!c.down), pUp = BJ.p.filter(c=>!c.down);
  const dv = dUp.length ? bjVal(dUp) : "";

  $("bjDV").innerHTML = dv!=="" ? `<small>DEALER</small>${dv}` : "";
  $("bjPV").innerHTML = pv!=="" ? `<small>YOU</small>${pv}` : "";
  const m = $("bjMsg"); m.textContent = BJ.msg; m.className = "bjmsg " + BJ.cls;
  const showBet = ph==="bet" || ph==="deal" || ph==="play" || ph==="dealer";
  const shown = BJ.bet - (BJ.pend||0); $("bjBet").innerHTML = showBet && shown > 0 ? bjStackHTML(shown) : "";

  const chips = [10,25,50,100].map(n=>`<button class="bjchip c${n}" data-bj="bet:${n}" ${BJ.bank<n||BJ.busy?"disabled":""}>$${n}</button>`).join("");

    ? `<button class="bjbtn go" data-bj="hit" ${!play||BJ.busy?"disabled":""}>Hit</button><button class="bjbtn go" data-bj="stand" ${!play||BJ.busy?"disabled":""}>Stand</button><button class="bjbtn ghost" data-bj="double" ${play&&!BJ.busy&&BJ.p.length===2&&BJ.bank>=BJ.bet?"":"disabled"}>Double</button>`
    : broke ? `<button class="bjbtn go" data-bj="refill">Out of chips — get another $1,000</button>`
    : chips + `<button class="bjbtn go" data-bj="deal" ${BJ.bet&&!BJ.busy?"":"disabled"}>${done?"Deal again · $"+BJ.bet:"Deal"}</button>${ph==="bet"&&BJ.bet?`<button class="bjbtn ghost" data-bj="clear">Clear bet</button>`:""}`;
  $("bjStats").innerHTML = `<span>Bank <b>$${BJ.bank.toLocaleString()}</b></span><span>Bet <b>$${BJ.bet}</b></span><span>Hands <b>${BJ.hands}</b></span><span>W–L <b>${BJ.w}–${BJ.l}</b></span>`;
}

function bjFB(){ try { if (window.firebase && firebase.apps && firebase.apps.length && firebase.auth) { const u = firebase.auth().currentUser; if (u) return {db:firebase.firestore(), u}; } } catch(e) {} return null; }
function bjName(u){ const n = (u.displayName || (u.email||"Player").split("@")[0]).trim().split(/\s+/); return (n[0] + (n.length>1 ? " " + n[n.length-1][0] + "." : "")).slice(0, 40); }
let bjPushT = 0;
function bjSave(){
  try { localStorage.setItem("jj-bj", JSON.stringify({bank:BJ.bank, peak:BJ.peak, hands:BJ.hands, w:BJ.w, l:BJ.l})); } catch(e) {}

function bjPush(){
  const fb = bjFB(); if (!fb || !BJ.synced) return;
  const bank = Math.round(BJ.bank + (BJ.phase==="bet" ? BJ.bet : 0));
  fb.db.collection("bjLeaders").doc(fb.u.uid).set({name:bjName(fb.u), bank, peak:Math.round(Math.max(BJ.peak, bank)), hands:BJ.hands, wins:BJ.w, losses:BJ.l, updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(()=>{ BJ.boardAt = 0; bjBoard(); }).catch(e=>{ BJ.boardErr = "Couldn't save your score (" + (e.code||"error") + ")"; bjLBRender(); });
}
async function bjSync(tries){
  if (BJ.synced) return;
  const fb = bjFB();
  if (!fb) { if ((tries||0) < 6) setTimeout(()=>bjSync((tries||0)+1), 1000); return; }
  try {
    const d = await fb.db.collection("bjLeaders").doc(fb.u.uid).get();
    if (d.exists) { const x = d.data(); if (!BJ.busy && BJ.phase!=="play") { BJ.bank = x.bank; BJ.peak = x.peak||x.bank; BJ.hands = x.hands||0; BJ.w = x.wins||0; BJ.l = x.losses||0; BJ.bet = 0; if (BJ.phase==="done") BJ.phase = "bet"; } }
    BJ.synced = true; if (!d.exists) bjPush(); bjUI(); bjBoard(true);
  } catch(e) { BJ.boardErr = "Leaderboard unavailable (" + (e.code||"error") + ")"; bjLBRender(); }
}
async function bjBoard(force){

// ---------- "Changed answer" tracker ----------
// Every submitted answer is logged as: kept (never switched), wc (wrong→right), cw (right→wrong) or ww (wrong→wrong).
function logAnswerChange(q, s, finalOi){
  s.first ??= {}; s.chgq ??= {};
  const first = s.first[q.id] === undefined ? finalOi : s.first[q.id];
  let k = "kept";
  if (first !== finalOi) k = first === q.a ? "cw" : finalOi === q.a ? "wc" : "ww";
  S.ac.push([q.id, k]);
  if (k !== "kept") s.chgq[q.id] = [first, finalOi]; else delete s.chgq[q.id];
  if (s !== S) { if (k !== "kept") S.chgq[q.id] = [first, finalOi]; else delete S.chgq[q.id]; }
  delete s.first[q.id];
}

function changeBox(c, title){

// FBS and CRS images live in their own files and only download the first time one of their figures is shown.
const LAZY_IMGS = [{re:/^fp-/, file:"images-fbs.js"}, {re:/^ce-/, file:"images-crs.js"}, {re:/^cb-/, file:"images-fbs-cb.js"}, {re:/^bc-/, file:"images-fbs-bc.js"}, {re:/^fe-/, file:"images-fbs-emb.js"}];
const lazyState = {}; // file -> 1 loading, 2 done
function loadLazyImgs(file){
  if (lazyState[file]) return; lazyState[file] = 1;
  const sc = document.createElement("script"); sc.src = file+"?v=34";
  sc.onload = ()=>{ lazyState[file] = 2; fixImgs(document); };
  sc.onerror = ()=>{ delete lazyState[file]; };
  document.head.appendChild(sc);
}
function fixImgs(root){
  root.querySelectorAll("img").forEach(i=>{
    const k=(i.dataset.k||i.getAttribute("src")||"").replace(/^\.\//,"");
    if (window.IMG && IMG[k]) { i.dataset.k=k; i.src=IMG[k]; }
    else { const L = LAZY_IMGS.find(x=>x.re.test(k)); if (L) { i.dataset.k=k; loadLazyImgs(L.file); } }
  });
}

// Pull a node out of any highlight it sits inside, splitting that highlight (and any formatting
// such as <b>/<i>/<sub> between them) around it. Formatting is kept on the lifted node.
function liftOutOfMarks(node, root){
  let top = null;
  for (let p = node.parentElement; p && p !== root && root.contains(p); p = p.parentElement) if (p.tagName === "MARK") top = p;
  if (!top) return;
  const stop = top.parentNode;
  let guard = 0;
  while (node.parentNode && node.parentNode !== stop && guard++ < 50) {
    const p = node.parentNode;
    if (p.tagName !== "MARK") { const w = p.cloneNode(false); w.removeAttribute && w.removeAttribute("id"); while (node.firstChild) w.appendChild(node.firstChild); node.appendChild(w); }
    const before = p.cloneNode(false), after = p.cloneNode(false);
    while (p.firstChild && p.firstChild !== node) before.appendChild(p.firstChild);
    p.removeChild(node);
    while (p.firstChild) after.appendChild(p.firstChild);
    if (before.textContent || (before.querySelector && before.querySelector("img"))) p.parentNode.insertBefore(before, p);
    p.parentNode.insertBefore(node, p);
    if (after.textContent || (after.querySelector && after.querySelector("img"))) p.parentNode.insertBefore(after, p);
    p.remove();
  }
}
function highlightSelection(){
  const el = $("stem"), sel = window.getSelection();
  if (!el || !sel.rangeCount || sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  if (!el.contains(r.commonAncestorContainer)) return false;
  // If everything selected is already highlighted, this acts as the eraser.
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let anyText = false, allMarked = true;
  for (let n = tw.nextNode(); n; n = tw.nextNode()) {
    if (!r.intersectsNode(n) || !n.textContent.trim()) continue;
    anyText = true;
    const mk = n.parentElement.closest("mark");
    if (!mk || !el.contains(mk)) { allMarked = false; break; }
  }
  if (!anyText) { sel.removeAllRanges(); return false; }
  const m = document.createElement("mark");
  m.appendChild(r.extractContents());
  r.insertNode(m);
  m.querySelectorAll("mark").forEach(x=>x.replaceWith(...x.childNodes));
  liftOutOfMarks(m, el);
  if (allMarked) m.replaceWith(...m.childNodes);          // erase
  else m.className = "hl-" + hlColor;                       // highlight in the chosen color
  el.querySelectorAll("mark").forEach(x=>{ if (!x.textContent) x.remove(); });
  sel.removeAllRanges(); el.normalize(); saveStem(); return true;
}
