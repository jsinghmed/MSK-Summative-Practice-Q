  else if (t.name==="bpool") B.pool = t.value;
  else if (t.name==="bmode") B.mode = t.value;
  else if (t.name==="bui") B.ui = t.value;
  else if (t.id==="bPer") B.per = +t.value;
  else if (t.id==="bScr") B.scr = t.checked;
  else if (t.id==="bN") { B.n = Math.max(1, +t.value||1); saveBuilder(); return; }
  else return;
  saveBuilder(); renderBuilder();
});
document.addEventListener("toggle", e=>{ const d = e.target; if (d.dataset && d.dataset.bopen) { B.open[d.dataset.bopen] = d.open; saveBuilder(); } }, true);

// search box
let searchT = 0;
document.addEventListener("input", e=>{
  const id = e.target.id;
  if (id!=="homeSearchIn" && id!=="pageSearchIn") return;
  const v = e.target.value;
  clearTimeout(searchT);
  searchT = setTimeout(()=>{
    if (id==="homeSearchIn") { if (v.trim().length >= 2) startGlobalSearch(v); return; }
    searchTerm = v; renderSearch();
  }, 180);
});
document.addEventListener("keydown", e=>{
  const sid = e.target.id;
  if (e.key==="Enter" && (sid==="pageSearchIn" || sid==="homeSearchIn")) {
    e.preventDefault(); clearTimeout(searchT);
    if (isBJ(e.target.value)) { e.target.value = ""; openBJ(); return; }
    if (sid==="homeSearchIn") { searchScope = "all"; searchFilter = "all"; }
    if (addChip(e.target.value)) { e.target.value = ""; refreshChips(); }
    return;
  }
  if (e.key==="Backspace" && sid==="pageSearchIn" && !e.target.value && searchChips.length) {
    e.preventDefault(); const last = searchChips.pop(); searchTerm = last; refreshChips(); const inp = $("pageSearchIn"); inp.setSelectionRange(last.length, last.length); return;
  }
  if (e.key==="Escape" && (e.target.id==="pageSearchIn" || e.target.id==="homeSearchIn")) { e.target.blur(); if (inSearch()) leaveSearch(); else e.target.value=""; }
});
$("searchIn").addEventListener("input", e=>{
  const v = e.target.value; $("searchWrap").classList.toggle("has", !!v);
  clearTimeout(searchT);
  searchT = setTimeout(()=>{
    searchTerm = v;
    if (v.trim().length >= 2) { if (!inSearch()) searchScope = "course"; rememberSpot(); view = "search"; $("pageSearchIn") && ($("pageSearchIn").value = v); renderAll(); $("searchIn").focus(); }
    else if (!v.trim() && view==="search" && !searchChips.length) leaveSearch();
  }, 220);
});
$("searchIn").addEventListener("keydown", e=>{
  if (e.key==="Escape") { $("searchClr").click(); e.target.blur(); }
  if (e.key==="Enter") { e.preventDefault(); clearTimeout(searchT); if (isBJ(e.target.value)) { openBJ(); return; } if (!inSearch()) searchScope = "course"; if (addChip(e.target.value)) { e.target.value = ""; $("searchWrap").classList.remove("has"); refreshChips(); } }
});

document.addEventListener("mousedown", e=>{ if (e.target.closest && e.target.closest("#hlMenu")) e.preventDefault(); });
// Google: form submit, home box, selection bubble
document.addEventListener("submit", e=>{ if (e.target.id==="gForm") { e.preventDefault(); googleOpen($("gIn").value); $("gMenu").classList.remove("open"); } });
document.addEventListener("click", e=>{ if (e.target.closest && e.target.closest("#homeGoogleGo")) { googleOpen($("homeGoogleIn").value); } });
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.id==="homeGoogleIn") { e.preventDefault(); googleOpen(e.target.value); } if (e.key==="Escape" && $("gMenu") && $("gMenu").classList.contains("open")) { $("gMenu").classList.remove("open"); } }, true);
$("gBubble").addEventListener("mousedown", e=>e.preventDefault());
$("gBubble").addEventListener("click", ()=>{ googleOpen(gBubbleText); $("gBubble").classList.remove("on"); window.getSelection().removeAllRanges(); });
let gSelT = 0;
document.addEventListener("selectionchange", ()=>{ clearTimeout(gSelT); gSelT = setTimeout(placeGBubble, 180); });
window.addEventListener("scroll", ()=>$("gBubble").classList.remove("on"), true);
window.addEventListener("resize", ()=>$("gBubble").classList.remove("on"));
document.addEventListener("mouseup", e=>{
  if (!(view==="quiz" && mode==="hl" && e.target.closest && e.target.closest("#stem"))) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) { highlightSelection(); return; }
  const mk = e.target.closest("#stem mark");
  if (mk) { mk.replaceWith(...mk.childNodes); $("stem").normalize(); saveStem(); }
});
$("note").addEventListener("input", e=>{
  const id = curQ().id; if (e.target.value.trim()) S.notes[id]=e.target.value; else delete S.notes[id]; save();
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && $("hlMenu") && $("hlMenu").classList.contains("open")) { $("hlMenu").classList.remove("open"); return; }
  if (e.target.matches("textarea,input,select")) return;
  if (e.key==="Escape") {
    if ($("lightbox").classList.contains("on")) { $("lightbox").classList.remove("on"); return; }
    if (openMenu) { openMenu = null; renderTools(); return; }
    if (focusOn) { setFocus(false); return; }
    if (inSearch()) { leaveSearch(); return; }
    return;
  }
  if (view !== "quiz" || (timedActive() && paused)) return;
  if (e.key==="ArrowLeft") return go(pos()-1);
  if (e.key==="ArrowRight") return go(pos()+1);
  const q = curQ(); if (!q) return;
  if (e.key==="Enter") {
    if (timedActive()) return go(pos()+1);
    if (q.type==="reveal") { const s = store(); if (s.ans[q.id]===undefined) { s.ans[q.id]="shown"; save(); renderCard(); } return; }
    return submit();
  }
  const k = e.key.toUpperCase();
  if (q.type!=="reveal" && k.length===1 && LET.indexOf(k)>=0 && !e.metaKey && !e.ctrlKey) {
    const o = order(q), idx = LET.indexOf(k);
    if (idx < o.length) pick(o[idx]);
  }
});

// timer for timed blocks (runs only while the block is open, unpaused and the page is visible)
let tick = 0;
setInterval(()=>{
  if (view!=="quiz" || !timedActive() || paused || document.visibilityState!=="visible") return;
  const t = chap().test;
  t.remaining = Math.max(0, (t.remaining||0) - 1);
  const el = $("timer");
  if (el) { el.textContent = "⏱ " + fmtTime(t.remaining); el.classList.toggle("low", t.remaining<=60); }
  if (++tick % 5 === 0) save();
  if (t.remaining <= 0) finishTest(t, "time");
}, 1000);

// Restore where you were: same page, same chapter, same question (matched by question, not just number).
Object.keys(S.posId).forEach(k=>{ const c = getChap(k); if (!c) { delete S.posId[k]; return; } const i = c.ids.indexOf(S.posId[k]); if (i >= 0) S.pos[k] = i; });
if (S.lastView==="quiz" && S.cur && chap() && chap().key===S.cur) { view = "quiz"; if (timedActive()) paused = true; }
else if (S.lastView==="report" && S.tests.find(x=>x.id===S.lastReport)) { view = "report"; reportTest = S.lastReport; }
else if (S.lastView==="builder" || S.lastView==="notes") view = S.lastView;
window.addEventListener("pagehide", ()=>{ rememberPlace(); save(); });
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) { rememberPlace(); save(); } });
themeLabel();
if (S.openSec === undefined) S.openSec = secOf(S.cur) || (courseSecs()[0] ? courseSecs()[0].prefix : null);
save();
renderAll();
// Progress summary used by sign-in sync / the admin page (computed from any saved state).
window.JJ_STATS = function(st){
  st = st || S; const s = {ans: st.ans || {}};
  const courses = {}, sections = [];
  SECTIONS.forEach(sec=>{
    const qs = sec.items, done = qs.filter(q=>answered(q,s)), ok = done.filter(q=>status(q,s)==="ok").length;
    sections.push({course:sec.course, name:(sec.nbme?"NBME · ":"")+sec.name, total:qs.length, answered:done.length, correct:ok});
    if (sec.nbme) return;
    const c = courses[sec.course] = courses[sec.course] || {name:(COURSE_BY_ID[sec.course]||{}).name||sec.course, total:0, answered:0, correct:0};
    c.total += qs.length; c.answered += done.length; c.correct += ok;
  });
  const cnt = o => Object.keys(o||{}).length;
  return {courses, sections, flagged:cnt(st.flag), notes:Object.values(st.notes||{}).filter(v=>String(v).trim()).length,
    anki:(st.anki||[]).length, tests:(st.tests||[]).length, highlights:cnt(st.hl), lastCourse:st.course||null};
};

// Welcome screen: shown every time the page loads.
// Fresh visit / new tab → Enter goes to the home screen. Refresh in the same tab → Enter returns you to where you were.
(function(){
  const sp = $("splash"); let seen = false;
  try { window.JJ_LOGO = sp.querySelector("img").src; } catch(e) {}
  try { seen = sessionStorage.getItem("jj-entered")==="1"; } catch(e) {}
  // After sign-in loads your synced progress, the page reloads once — skip the logo that time.
  try { if (sessionStorage.getItem("jj-skip-splash")==="1") { sessionStorage.removeItem("jj-skip-splash"); sp.remove(); return; } } catch(e) {}
  document.documentElement.style.overflow = "hidden";
  const enter = ()=>{
    if (!sp.isConnected || sp.classList.contains("out")) return;
    try { sessionStorage.setItem("jj-entered","1"); } catch(e) {}
    if (!seen) { view = "home"; focusOn = false; paused = false; openMenu = null; renderAll(); $("main").scrollTo({top:0}); }
    sp.classList.add("out"); document.documentElement.style.overflow = "";
    document.removeEventListener("keydown", onKey, true);
    setTimeout(()=>sp.remove(), 500);
  };
  const onKey = e=>{ if (e.key==="Enter" || e.key===" " || e.key==="ArrowRight") { e.preventDefault(); e.stopPropagation(); enter(); } };
  document.addEventListener("keydown", onKey, true);
  $("splashEnter").addEventListener("click", enter);
  setTimeout(()=>{ try { $("splashEnter").focus({preventScroll:true}); } catch(e) {} }, 50);
})();
})();
</script>

// Fail closed: if sign-in can't load (blocked, missing or failed file), the site stays locked instead of opening.

  if (!document.documentElement.classList.contains("jjlock") || document.getElementById("jjGate")) return;
  var m = document.createElement("div"); m.className = "jjlockmsg";
  m.innerHTML = '<div><b>Sign-in couldn\'t load</b>JJ QBank needs Google sign-in. Check your connection, turn off any blocker for this site, and refresh.<br><button onclick="location.reload()">Refresh</button></div>';
  document.body.appendChild(m);
}, 4000);
</script>
